<!DOCTYPE html>
<html>
<head>
    <title>CSRF Login</title>
</head>
<body>

<h1>CSRF Lab Login</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST" action="/csrf-login">

    <label>Username:</label>
    <input type="text" name="username" required>

    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <br><br>

    <button type="submit">Login</button>

</form>

<hr>

<h3>Test accounts</h3>

<p>Viner / viner123</p>
<p>Carlos / carlos123</p>

</body>
</html>
